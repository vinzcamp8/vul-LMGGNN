<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Code Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        textarea {
            width: 100%;
            height: 200px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            white-space: pre-wrap;
        }
        #status {
            margin-top: 10px;
            font-weight: bold;
        }
        #icon {
            margin-top: 10px;
            width: 33%;
            height: 33%;
            position: relative;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        #prediction {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
            font-size: 30px;
        }
    </style>
    <script>
        let processingDots = 0;

        function analyzeCode() {
            const code = document.getElementById('code').value;
            document.getElementById('status').innerText = 'Submitting code for analysis...';
            document.getElementById('result').innerText = '';
            fetch('/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'code=' + encodeURIComponent(code)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'Processing...') {
                    document.getElementById('status').innerText = 'Processing';
                    processingDots = 0;
                    pollForResult();
                }
            });
        }

        function pollForResult() {
            fetch('/result')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'Processing...') {
                    processingDots = (processingDots + 1) % 4;
                    let dots = '.'.repeat(processingDots);
                    document.getElementById('status').innerText = 'Processing' + dots;
                    setTimeout(pollForResult, 1000);
                } else {
                    document.getElementById('status').innerText = 'Analysis complete.';
                    document.getElementById('result').innerText = JSON.stringify(data, null, 2);
                    if (data.predicted_label == 0){
                        document.getElementById('icon').innerHTML = '<img src="icons/secure.png" alt="secure" id="icon">';
                        document.getElementById('prediction').innerHTML = 'The function is secure';
                    }
                    else if (data.predicted_label == 1){
                        document.getElementById('icon').innerHTML = '<img src="icons/unsecure.png" alt="unsecure" id="icon">';
                        document.getElementById('prediction').innerHTML = 'The function is vulnerable';
                    }

                }
            });
        }
    </script>
</head>
<body>
    <center><h1>Source Code Vulnerability Detection</h1></center>
    <form onsubmit="event.preventDefault(); analyzeCode();">
        <textarea id="code" name="code" placeholder="Enter your code here..."></textarea><br>
        <center><button type="submit">Analyze</button></center>
    </form>
    <center><div id="status"></div></center>
    <pre id="result"></pre>
    <div id="icon"></div>
    <div id="prediction"></div>
</body>
</html>
